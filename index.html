<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="jogo">
            <h1>Jogo de Adivinhação</h1>
            <p>Tente adivinhar o número secreto entre 1 e 100!</p>

            <input type="number" id="palpite" min="1" max="100" placeholder="Digite seu palpite">

            <button id="btnChutar" onclick="verificarPalpite()">Chutar</button>

            <p id="mensagem">Faça seu primeiro palpite!</p>

            <p id="tentativas">Tentativas restantes: 10</p>
        </section>

        <section class="imagem">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80"
                alt="Videogame relacionado a jogos">
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
